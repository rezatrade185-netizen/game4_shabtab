<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی شب‌تاب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }
        
        h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        .content {
            color: #555;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        
        .footer {
            color: #999;
            font-size: 0.9em;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin: 10px 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 بازی شب‌تاب</h1>
        <p class="subtitle">به صفحه رسمی خوش آمدید</p>
        
        <div class="content">
            <p>این پروژه تحت توسعه است.</p>
            <p>به زودی بیشتر محتوا اضافه خواهد شد!</p>
        </div>
        
        <div>
            <span class="badge">Game 4</span>
            <span class="badge">Shabtab</span>
        </div>
        
        <div class="footer">
            <p>📍 <a href="https://github.com/rezatrade185-netizen/game4_shabtab" style="color: #667eea; text-decoration: none;">مخزن GitHub</a></p>
            <p style="margin-top: 10px;">© 2026 - تمامی حقوق محفوظ است</p>
        </div>
    </div>
</body>
</html>
